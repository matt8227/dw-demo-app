---
name: 'Java CI on pull request'
'on':
  pull_request:
    branches:
      - '*'
jobs:
  build:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@v4'
      - name: 'Set up JDK 1.8'
        uses: 'actions/setup-java@v4'
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
      - name: 'Build with Maven'
        run: 'mvn -B install --file pom.xml'
